version: '3.8'
services:
  db:
    container_name: dx-torchx-ai-db
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dx_torchx_ai
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgres/data
      - ./init_db:/docker-entrypoint-initdb.d
    networks:
      network:
        ipv4_address: 10.5.0.10

  pgadmin:
    container_name: pg_admin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      network:
        ipv4_address: 10.5.0.11

  web_server:
    container_name: dx-torchx-ai-server
    build: ./dx-torchx-ai-server
    depends_on:
      - db
    environment:
      DB_HOST: 10.5.0.10
      ML_API_HOST: 10.5.0.13
      ML_API_PORT: 3001
    ports:
      - "8080:3000"
    networks:
      network:
        ipv4_address: 10.5.0.12
    volumes:
      - ./test_images:/app/test_images

  ml_engine:
    container_name: dx-torchx-ai-ml-engine
    build: ./dx-torchx-ai-ml-engine
    ports:
      - "8081:3001"
    networks:
      network:
        ipv4_address: 10.5.0.13

volumes:
  db:
    driver: local

networks:
  network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1
